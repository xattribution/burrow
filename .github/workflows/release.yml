name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./... && go test ./...
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}

  # The phone app: shared-core tests against the real server, UI tests at phone,
  # foldable and tablet sizes, lint, and a debug APK to try out.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Test, lint and build
        working-directory: android
        run: ./gradlew --no-daemon :shared:jvmTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: burrow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/outputs/roborazzi
            android/app/build/reports
            android/shared/build/reports
          retention-days: 14

  # The app on a real Android (an emulator): the device key in the Keystore, a
  # photo backup from the media library, background sync through WorkManager,
  # and the R8-shrunk release build paired and browsed through its own screens.
  android-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app, its device tests and the release build
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Start Burrow
        run: android/ci/server.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/device-tests.sh

  # A version tag (v1.2.3) builds the APK signed with the release key, which
  # only exists in the "release" environment (limited to v* tags), and
  # attaches it to a GitHub release.
  apk:
    needs: [test, android, android-device]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::The release environment has no ANDROID_KEYSTORE_BASE64 secret."; exit 1; fi
          umask 077
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build the signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BURROW_VERSION: ${{ github.ref_name }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Check the signature
        id: sig
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee certs.txt
          if grep -q 'Android Debug' certs.txt; then echo "::error::The APK was signed with a debug key."; exit 1; fi
          echo "cert=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT: ${{ steps.sig.outputs.cert }}
        run: |
          V="$GITHUB_REF_NAME"
          cp android/app/build/outputs/apk/release/app-release.apk "burrow-$V.apk"
          sha256sum "burrow-$V.apk" > SHA256SUMS
          {
            echo "## Phone app"
            echo "Download **burrow-$V.apk** on your Android phone and open it to install (allow installs from your browser or file manager when asked). Updates install over the old version."
            echo
            echo "- APK SHA-256: \`$(cut -d' ' -f1 SHA256SUMS)\`"
            echo "- Signing certificate SHA-256: \`$CERT\` (every release is signed with the same key)"
            echo
            echo "## Server"
            echo "\`ghcr.io/${GITHUB_REPOSITORY}:${V#v}\`"
          } > notes.md
          if gh release view "$V" > /dev/null 2>&1; then
            gh release upload "$V" "burrow-$V.apk" SHA256SUMS --clobber
          else
            gh release create "$V" "burrow-$V.apk" SHA256SUMS --title "Burrow $V" --notes-file notes.md --generate-notes --verify-tag
          fi
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
